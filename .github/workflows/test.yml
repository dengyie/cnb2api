name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: deploy scripts syntax
        run: |
          python3 -m py_compile deploy/cnb-register.py
          bash -n deploy/start.sh
